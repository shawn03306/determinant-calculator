<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>行列式計算機</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap');
:root{color-scheme:light;--paper:#f7f6f2;--card:#fffefa;--ink:#222922;--muted:#84877d;--line:#e8e7de;--green:#365e49;--soft:#eef1e9;--amber:#a57335}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans','Noto Sans TC',sans-serif;-webkit-font-smoothing:antialiased}.page{max-width:1080px;margin:auto;padding:58px 34px 72px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:55px}.brand{display:flex;gap:10px;align-items:center;color:var(--green);font-size:13px;font-weight:700;letter-spacing:.1em}.brand-mark{width:25px;height:25px;border:1.5px solid var(--green);display:grid;place-items:center;font-family:'DM Mono',monospace;font-size:13px}.top-note{color:var(--muted);font-size:12px;letter-spacing:.03em}.intro{margin-bottom:32px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.intro h1{font-size:clamp(35px,6vw,54px);letter-spacing:-.06em;margin:11px 0 9px;font-weight:600;line-height:1.15}.intro p{color:#77796f;font-size:14px;margin:0;line-height:1.8}.layout{display:grid;grid-template-columns:minmax(0,1.22fr) minmax(300px,.78fr);gap:18px;align-items:start}.card{background:var(--card);border:1px solid var(--line);border-radius:8px}.editor{padding:25px 27px 26px}.card-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}.card-title{font-size:14px;font-weight:700}.order{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px}.order select{font:inherit;color:var(--ink);border:1px solid var(--line);background:#fffefa;padding:7px 27px 7px 10px;border-radius:4px;cursor:pointer}.matrix-wrap{display:flex;align-items:center;justify-content:center;min-height:210px;padding:9px 0 14px;overflow-x:auto}.matrix{position:relative;display:grid;gap:8px;padding:5px 16px}.matrix:before,.matrix:after{content:"";position:absolute;top:0;bottom:0;width:8px;border-color:#acb7a8}.matrix:before{left:0;border-left:1.5px solid;border-top:1.5px solid;border-bottom:1.5px solid;border-radius:3px 0 0 3px}.matrix:after{right:0;border-right:1.5px solid;border-top:1.5px solid;border-bottom:1.5px solid;border-radius:0 3px 3px 0}.cell{width:clamp(54px,9vw,72px);height:43px;text-align:center;border:1px solid #e7e6de;background:#fffefa;border-radius:3px;font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s}.cell:focus{border-color:#66816c;box-shadow:0 0 0 3px #365e4915}.cell.invalid{border-color:#c98068}.tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:13px}.hint{font-size:11px;color:#929188}.actions{display:flex;gap:8px;align-items:center}.button{font:inherit;border:1px solid var(--line);border-radius:4px;background:transparent;padding:9px 13px;font-size:12px;font-weight:600;cursor:pointer;color:#565a51;transition:background .15s,border-color .15s}.button:hover{background:#f3f3ed;border-color:#d8d8cf}.button.primary{background:var(--green);border-color:var(--green);color:white;padding-left:19px;padding-right:19px}.button.primary:hover{background:#294938}.button.primary:active{transform:translateY(1px)}.result{overflow:hidden}.result-top{padding:24px 25px 22px}.result-label{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.12em}.result-value{font:500 clamp(43px,6vw,64px)/1.15 'DM Mono',monospace;letter-spacing:-.075em;margin:20px 0 14px;color:var(--green);overflow-wrap:anywhere;min-height:72px}.result-value.empty{color:#d8d8ce}.result-foot{font-size:11px;color:#85877e;line-height:1.8}.result-divider{border:0;border-top:1px solid var(--line);margin:0}.steps{padding:20px 25px 23px}.steps-title{font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px}.steps-title:before{content:'';width:6px;height:6px;border-radius:50%;background:#80977c}.steps-body{font-size:12px;line-height:1.9;color:#77796f;margin-top:13px;min-height:78px}.steps-body .math{display:block;font-family:'DM Mono',monospace;color:#454a42;font-size:11px;margin:5px 0;overflow-wrap:anywhere}.steps-body .note{color:var(--amber)}.footer{margin-top:21px;text-align:center;color:#9a9a90;font-size:10px;letter-spacing:.025em}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,12px);padding:10px 16px;background:#26392c;color:white;border-radius:5px;font-size:12px;opacity:0;transition:all .2s;pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}button:focus-visible,select:focus-visible{outline:2px solid #66816c;outline-offset:2px}@media(max-width:720px){.page{padding:32px 18px 48px}.top{margin-bottom:41px}.top-note{font-size:10px}.layout{grid-template-columns:1fr}.result-value{margin:12px 0;min-height:auto}.editor{padding:21px 17px}.result-top,.steps{padding-left:20px;padding-right:20px}.matrix{gap:6px;padding:5px 13px}.cell{height:40px;width:clamp(48px,15vw,66px)}.hint{max-width:125px;line-height:1.6}.tools{align-items:flex-end}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<main class="page">
  <header class="top"><div class="brand"><span class="brand-mark">|A|</span><span>LINEAR ALGEBRA</span></div><span class="top-note">快速・清晰・逐步計算</span></header>
  <section class="intro"><div class="eyebrow">MATRIX TOOL&nbsp; / &nbsp;01</div><h1>行列式計算機</h1><p>輸入一個方陣，立即計算行列式並檢視運算過程。</p></section>
  <section class="layout" aria-label="行列式計算工具">
    <section class="card editor" aria-label="矩陣輸入區"><div class="card-head"><div class="card-title">輸入方陣 <span style="color:#929188;font-weight:400">A</span></div><label class="order">矩陣大小<select id="size" aria-label="矩陣大小"></select></label></div><div class="matrix-wrap"><div class="matrix" id="matrix" role="group" aria-label="矩陣元素"></div></div><div class="tools"><span class="hint">點選數值即可編輯 · 可輸入小數</span><div class="actions"><button class="button" id="sample" type="button">載入範例</button><button class="button primary" id="calculate" type="button">計算行列式&nbsp; →</button></div></div></section>
    <section class="card result" aria-live="polite"><div class="result-top"><div class="result-label">DETERMINANT &nbsp; / &nbsp; det(A)</div><div class="result-value empty" id="value">—</div><div class="result-foot" id="resultFoot">選擇矩陣大小並輸入數值，<br>再按下計算。</div></div><hr class="result-divider"><div class="steps"><div class="steps-title">計算過程</div><div class="steps-body" id="steps">運算步驟會顯示在這裡。</div></div></section>
  </section>
  <footer class="footer">使用列主元高斯消去法計算 · 支援 2 × 2 至 6 × 6 方陣</footer>
</main><div class="toast" id="toast" role="status"></div>
<script>
const sizeSelect=document.getElementById('size'), matrixEl=document.getElementById('matrix'), valueEl=document.getElementById('value'), stepsEl=document.getElementById('steps'), footEl=document.getElementById('resultFoot'), toastEl=document.getElementById('toast');
let toastTimer;
for(let n=2;n<=6;n++){const option=document.createElement('option');option.value=n;option.textContent=`${n} × ${n}`;sizeSelect.append(option)}
sizeSelect.value='3';
function renderMatrix(values){const n=Number(sizeSelect.value);matrixEl.replaceChildren();matrixEl.style.gridTemplateColumns=`repeat(${n}, min-content)`;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const input=document.createElement('input');input.className='cell';input.type='text';input.inputMode='decimal';input.autocomplete='off';input.setAttribute('aria-label',`第 ${i+1} 列，第 ${j+1} 行`);input.value=values?.[i]?.[j]??(i===j?'1':'0');input.addEventListener('input',()=>{input.classList.remove('invalid');valueEl.textContent='—';valueEl.classList.add('empty');footEl.textContent='數值已變更，按下計算以更新結果。';stepsEl.textContent='運算步驟會顯示在這裡。'});input.addEventListener('keydown',e=>{if(e.key==='Enter')calculate()});matrixEl.append(input)}}
sizeSelect.addEventListener('change',()=>{renderMatrix();valueEl.textContent='—';valueEl.classList.add('empty');footEl.textContent='選擇矩陣大小並輸入數值，再按下計算。';stepsEl.textContent='運算步驟會顯示在這裡。'});
function fmt(x){if(Math.abs(x)<1e-10)return'0';const near=Math.round(x);if(Math.abs(x-near)<1e-10)return String(near);return Number(x.toPrecision(8)).toString()}
function calculate(){const n=Number(sizeSelect.value),cells=[...matrixEl.querySelectorAll('input')],a=Array.from({length:n},(_,i)=>cells.slice(i*n,(i+1)*n).map(x=>{const t=x.value.trim();return t===''?NaN:Number(t)}));let bad=false;cells.forEach((c,k)=>{const t=c.value.trim();if(t===''||!Number.isFinite(Number(t))){c.classList.add('invalid');bad=true}});if(bad){footEl.textContent='請確認每個欄位都是有效的數字。';stepsEl.innerHTML='<span class="note">空白欄位或無效數值以紅框標示。</span>';return}cells.forEach(c=>c.classList.remove('invalid'));let det=1,swaps=0;const log=['以列主元高斯消去法，將矩陣化為上三角矩陣。'];for(let k=0;k<n;k++){let p=k;for(let i=k+1;i<n;i++)if(Math.abs(a[i][k])>Math.abs(a[p][k]))p=i;if(Math.abs(a[p][k])<1e-12){det=0;log.push(`第 ${k+1} 欄的主元為 0，矩陣為奇異矩陣。`);break}if(p!==k){[a[k],a[p]]=[a[p],a[k]];swaps++;log.push(`交換第 ${k+1} 列與第 ${p+1} 列，行列式變號。`)}const pivot=a[k][k];det*=pivot;log.push(`第 ${k+1} 個主元：${fmt(pivot)}。`);for(let i=k+1;i<n;i++){const factor=a[i][k]/pivot;if(Math.abs(factor)>1e-12){for(let j=k+1;j<n;j++)a[i][j]-=factor*a[k][j];log.push(`R${i+1} ← R${i+1} − (${fmt(factor)})R${k+1}`)}a[i][k]=0}}if(swaps%2)det=-det;if(Math.abs(det)<1e-10)det=0;valueEl.textContent=fmt(det);valueEl.classList.remove('empty');footEl.innerHTML=det===0?'此矩陣不可逆（奇異矩陣）。':'行列式等於上三角矩陣對角線元素的乘積'+(swaps%2?'，並依列交換次數調整正負號。':'。');stepsEl.innerHTML=log.map((x,i)=>`<span class="math">${i===0?x:x.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</span>`).join('');}
document.getElementById('calculate').addEventListener('click',calculate);
function showToast(message){toastEl.textContent=message;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1900)}
document.getElementById('sample').addEventListener('click',()=>{const n=Number(sizeSelect.value);const samples={2:[[3,8],[4,6]],3:[[2,1,3],[0,-1,4],[5,2,0]],4:[[1,2,0,1],[0,1,3,0],[2,0,1,1],[0,1,0,2]]};const s=samples[n]??Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?i+2:(i+j)%3-1));renderMatrix(s);showToast('已載入範例矩陣');calculate()});
renderMatrix();
</script>
</body>
</html>
